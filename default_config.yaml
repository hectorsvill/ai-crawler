ollama:
  base_url: "http://localhost:11434"
  navigator_model: "qwen3:8b"
  extractor_model: "qwen2.5:7b"
  router_model: "llama3.2:3b"
  timeout: 180
  max_retries: 3

llm:
  # ollama | gemini | anthropic | openai | deepseek   (env: CRAWLER_LLM__PROVIDER)
  provider: "ollama"
  # Model for all roles on API providers (env: CRAWLER_LLM__MODEL). Empty = provider default:
  #   gemini: gemini-2.5-flash  anthropic: claude-haiku-4-5  openai: gpt-4.1-mini  deepseek: deepseek-chat
  model: null
  timeout: 120
  max_retries: 3
  # Optional price table for cost estimates (USD per 1M tokens). Fill from the
  # provider's current pricing page; unknown models record cost = null.
  # prices:
  #   gemini-2.5-flash: {input: 0.0, output: 0.0}
  prices: {}
  # API keys: env vars only (GEMINI_API_KEY | GOOGLE_API_KEY, ANTHROPIC_API_KEY,
  # OPENAI_API_KEY, DEEPSEEK_API_KEY) or ~/.config/ai-crawler/env (chmod 600).

crawl:
  max_depth: 5
  max_pages: 500
  rate_limit_per_domain: 2  # requests per second
  delay_range: [1.0, 3.0]
  # Honest, identifiable UA (robots.txt rules are evaluated against it).
  # Add browser UAs here only for sites whose terms allow it.
  user_agents:
    - "ai-crawler/1.0 (+https://github.com/hectorsvill/ai-crawler)"
  domain_allowlist: []
  domain_denylist: []
  use_playwright_for: []  # domain patterns requiring JS rendering

  # ── Sitemap + intelligent queuing ─────────────────────────────────────────
  sitemap_enabled: true
  sitemap_max_urls: 10000
  sitemap_priority_boost: 0.1   # bonus added to sitemap <priority> values
  priority_depth_decay: 0.15    # priority *= (1 - decay)^depth per level
  priority_url_heuristics: true # boost URLs whose path matches goal keywords

  # ── Adaptive rate limiting ────────────────────────────────────────────────
  backoff_base: 2.0        # base backoff seconds; doubles per retry
  backoff_max: 120.0       # maximum backoff cap in seconds
  rate_recovery_factor: 1.2  # rate multiplier per success window
  rate_success_window: 5     # consecutive successes before rate recovery
  max_retries_per_url: 3

  # ── Incremental crawling ──────────────────────────────────────────────────
  incremental_crawl: false
  incremental_older_than_days: 7
  conditional_requests: true   # send ETag/If-Modified-Since headers

storage:
  db_path: "crawl_data.db"

workflow:
  default: "auto"
