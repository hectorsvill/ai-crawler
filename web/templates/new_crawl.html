{% extends "base.html" %}
{% block title %}New Crawl — AI Crawler{% endblock %}

{% block content %}

<div class="max-w-2xl">
  <h1 class="text-lg font-semibold text-gray-100 mb-6">Launch a New Crawl</h1>

  <form id="crawl-form"
        hx-post="/api/crawl"
        hx-target="#form-result"
        hx-swap="innerHTML"
        class="space-y-5">

    <!-- Goal -->
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">
        Goal <span class="text-red-err">*</span>
      </label>
      <textarea name="goal" id="goal-input" rows="3" required
                placeholder="What do you want to extract or research? E.g. 'Extract all product prices from example.com'"
                class="w-full px-4 py-3 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       placeholder-gray-600 focus:outline-none focus:border-cyan-electric/50 resize-none
                       transition-colors font-sans"></textarea>
      <!-- Goal analysis -->
      <div class="mt-2">
        <button type="button"
                hx-post="/crawl/analyze"
                hx-include="#goal-input"
                hx-target="#goal-analysis"
                hx-swap="innerHTML"
                class="text-xs text-gray-500 hover:text-cyan-electric transition-colors">
          ⚡ Analyse goal (router preview)
          <span class="htmx-indicator ml-1 text-gray-600">…</span>
        </button>
        <div id="goal-analysis" class="mt-2"></div>
      </div>
    </div>

    <!-- Start URL -->
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">
        Start URL <span class="text-red-err">*</span>
      </label>
      <input type="url" name="start_url" required
             placeholder="https://example.com"
             class="w-full px-4 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                    font-mono placeholder-gray-600 focus:outline-none focus:border-cyan-electric/50 transition-colors">
    </div>

    <!-- Workflow + limits row -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Workflow</label>
        <select name="workflow"
                class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       focus:outline-none focus:border-cyan-electric/50 transition-colors">
          <option value="auto">Auto (router decides)</option>
          <option value="simple">Simple</option>
          <option value="langgraph">LangGraph</option>
          <option value="crewai">CrewAI</option>
          <option value="research">Research (academic papers)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Max Pages</label>
        <input type="number" name="max_pages" min="1" max="5000"
               value="{{ config.crawl.max_pages }}"
               class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                      font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Max Depth</label>
        <input type="number" name="max_depth" min="1" max="20"
               value="{{ config.crawl.max_depth }}"
               class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                      font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
      </div>
    </div>

    <!-- LLM provider + model (lists come from /api/models; API keys stay on the server) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">LLM Provider</label>
        <select name="provider" id="provider-select" class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
          <option value="">Loading…</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Model <span id="model-status" class="text-xs text-gray-600"></span></label>
        <select name="model" id="model-select" class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
          <option value="">(provider default)</option>
        </select>
      </div>
    </div>

    <!-- Ollama per-role overrides (only used when provider = ollama) -->
    <details id="ollama-roles" class="text-sm text-gray-400">
      <summary class="cursor-pointer text-xs text-gray-500">Ollama per-role models</summary>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Navigator Model</label>
          <select name="navigator_model" class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
            <option value="">(config default)</option>
            {% for m in models %}
            <option value="{{ m }}">{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Extractor Model</label>
          <select name="extractor_model" class="w-full px-3 py-2.5 bg-surface border border-gray-700 rounded text-sm text-gray-100
                       font-mono focus:outline-none focus:border-cyan-electric/50 transition-colors">
            <option value="">(config default)</option>
            {% for m in models %}
            <option value="{{ m }}">{{ m }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </details>

    <!-- Submit -->
    <div class="flex flex-wrap items-center gap-3 pt-2">
      <button type="submit"
              class="flex-1 sm:flex-none px-6 py-3 sm:py-2.5 bg-cyan-electric/10 hover:bg-cyan-electric/20
                     border border-cyan-electric/50 text-cyan-electric text-sm font-medium rounded
                     transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Start Crawl
        <span class="htmx-indicator text-xs text-cyan-electric/50 ml-1">Launching…</span>
      </button>
      <a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition-colors">Cancel</a>
    </div>
  </form>

  <!-- Result / redirect -->
  <div id="form-result" class="mt-4"></div>

  <!-- Token usage panel (GET /api/usage) -->
  <div class="mt-8 p-4 rounded border border-gray-700 bg-surface">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-sm font-semibold text-gray-300">LLM token usage</h2>
      <button type="button" id="usage-refresh" class="text-xs text-gray-500 hover:text-cyan-electric">refresh</button>
    </div>
    <div id="usage-panel" class="text-xs font-mono text-gray-400">Loading…</div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
const provSel = document.getElementById('provider-select');
const modelSel = document.getElementById('model-select');
const modelStatus = document.getElementById('model-status');

function opt(value, label, disabled) {
  const o = document.createElement('option');
  o.value = value; o.textContent = label; o.disabled = !!disabled;
  return o;
}

async function loadProviders() {
  const r = await fetch('/api/models');
  const data = await r.json();
  provSel.innerHTML = '';
  for (const p of data.providers) {
    const label = p.configured ? `${p.provider}  (default: ${p.default_model})` : `${p.provider} — ${p.status}`;
    provSel.appendChild(opt(p.configured ? p.provider : '', label, !p.configured));
  }
  const active = data.providers.find(p => p.provider === data.active_provider && p.configured)
              || data.providers.find(p => p.configured);
  if (active) { provSel.value = active.provider; await loadModels(active.provider); }
}

async function loadModels(provider) {
  modelSel.innerHTML = '';
  modelSel.appendChild(opt('', '(provider default)'));
  document.getElementById('ollama-roles').style.display = provider === 'ollama' ? '' : 'none';
  if (!provider) return;
  modelStatus.textContent = 'loading…';
  const r = await fetch('/api/models?provider=' + encodeURIComponent(provider));
  const data = await r.json();
  if (data.error) { modelStatus.textContent = 'list unavailable'; return; }
  for (const m of data.models) {
    const tag = m.id === data.default_model ? ' (default)' :
                (Object.values(data.role_defaults || {}).includes(m.id) ? ' (extractor default)' : '');
    modelSel.appendChild(opt(m.id, m.id + tag));
  }
  modelStatus.textContent = `${data.models.length} models${data.cached ? ' · cached' : ''}`;
}
provSel.addEventListener('change', () => loadModels(provSel.value));

function fmt(n) { return (n ?? 0).toLocaleString(); }
async function loadUsage() {
  const el = document.getElementById('usage-panel');
  try {
    const r = await fetch('/api/usage?group_by=model&limit=5');
    const d = await r.json();
    const t = d.totals;
    let html = `<div>calls ${fmt(t.calls)} · tokens ${fmt(t.total_tokens)} (in ${fmt(t.prompt_tokens)} / out ${fmt(t.completion_tokens)})` +
               (t.cost_usd != null ? ` · ~$${t.cost_usd}` : '') + ` · errors ${fmt(t.errors)}</div>`;
    html += '<table class="mt-2 w-full"><tr class="text-gray-500"><td>provider</td><td>model</td><td class="text-right">calls</td><td class="text-right">tokens</td></tr>';
    for (const g of d.groups) {
      html += `<tr><td>${g.provider}</td><td>${g.model}</td><td class="text-right">${fmt(g.calls)}</td><td class="text-right">${fmt(g.total_tokens)}</td></tr>`;
    }
    el.innerHTML = html + '</table>';
  } catch (e) { el.textContent = 'usage unavailable'; }
}
document.getElementById('usage-refresh').addEventListener('click', loadUsage);
loadProviders(); loadUsage();

// When API returns session_id, redirect to session detail
document.getElementById('crawl-form').addEventListener('htmx:afterRequest', function(e) {
  try {
    const data = JSON.parse(e.detail.xhr.responseText);
    if (data.error) {
      const sugg = (data.suggestions || []).length ? ' Closest: ' + data.suggestions.join(', ') : '';
      document.getElementById('form-result').textContent = data.error + sugg;
      return;
    }
    if (data.detail) { document.getElementById('form-result').textContent = data.detail; return; }
    if (data.session_id) {
      document.getElementById('form-result').innerHTML =
        `<div class="p-3 rounded border border-green-ok/30 bg-green-ok/5 text-green-ok text-sm font-mono">
           Crawl started! <a href="/session/${data.session_id}" class="underline">View progress →</a>
         </div>`;
      setTimeout(() => { window.location = '/session/' + data.session_id; }, 1200);
    }
  } catch(e) {}
});
</script>
{% endblock %}
